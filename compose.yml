services:
  db:
    image: postgres:17
    container_name: lets-dine-db
    restart: on-failure
    ports:
      - "${DB_PORT:-5442}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis
    container_name: lets-dine-redis
    restart: on-failure
    ports:
      - "${REDIS_PORT:-6389}:6379"
    volumes:
      - redis_data:/data

  app:
    container_name: lets-dine-app
    build:
      context: .
      dockerfile: ./Dockerfile.local
      args:
        START_COMMAND: ${DEV_SCRIPT:-dev}
    init: true
    env_file:
      - .env
    # Overrides .env's host-oriented DATABASE_URL: inside the network the database
    # answers on the db service's internal port, not the published one.
    environment:
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=lets_dine
    ports:
      - "${PORT:-3100}:${PORT:-3100}"
      - "9229:9229"
    depends_on:
      - db
    command: sh -c "npm run ${DEV_SCRIPT:-dev}"
    # The anonymous /app/node_modules volume keeps the container's own Linux-built
    # node_modules (and Prisma engine) from being shadowed by the host's bind mount.
    volumes:
      - ./:/app
      - /app/node_modules

volumes:
  db_data:
  redis_data:
